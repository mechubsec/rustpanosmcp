[package]
name = "rust-panosmcp-core"
description = "Vendor client and tool logic for rust-panosmcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
async-trait = "0.1"
fastrand.workspace = true
futures-util.workspace = true
getrandom.workspace = true
mecmcp-audit.workspace = true
mecmcp-changeset.workspace = true
mecmcp-inventory.workspace = true
mecmcp-policy.workspace = true
mecmcp-redact.workspace = true
quick-xml.workspace = true
reqwest.workspace = true
rust-panosmcp-auth = { version = "0.16.0", path = "../rust-panosmcp-auth" }
rustix.workspace = true
rustls.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
tempfile = "3"

[dev-dependencies]
# `write_state_for_test` is behind this feature; the state writer it backs is
# `#[cfg(test)]` only. Dev-only, so a release build never enables it.
mecmcp-changeset = { workspace = true, features = ["test-util"] }
axum = "0.8"
axum-server = { workspace = true }
hex = "0.4"
mecmcp-audit = { workspace = true, features = ["test-util"] }
rcgen = "0.14"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
