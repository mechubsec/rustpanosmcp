name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Cancel superseded runs on pull requests (each push / branch update restarts CI);
  # runs on the default branch always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  build-test:
    name: Build, lint, and test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify toolchain sync
        run: |
          TOOLCHAIN_FILE=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          DOCKERFILE_VERSION=$(sed -n 's/^FROM rust:\([0-9.]*\)-.*/\1/p' Dockerfile)
          echo "rust-toolchain.toml: $TOOLCHAIN_FILE"
          echo "Dockerfile:          $DOCKERFILE_VERSION"
          # Both must carry a full X.Y.Z. A floating minor tag such as
          # `rust:1.97-slim-bookworm` lets a digest-only Dependabot refresh move the
          # builder from 1.97.0 to 1.97.1 while both strings still read "1.97" and
          # "1.97.0" — which a normalizing comparison would call a match. That had
          # already happened before this check was tightened.
          for pair in "rust-toolchain.toml:$TOOLCHAIN_FILE" "Dockerfile:$DOCKERFILE_VERSION"; do
            if [[ ! "${pair#*:}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: ${pair%%:*} must pin a full X.Y.Z version, got '${pair#*:}'"
              exit 1
            fi
          done
          if [[ "$TOOLCHAIN_FILE" != "$DOCKERFILE_VERSION" ]]; then
            echo "ERROR: toolchain versions do not match"
            exit 1
          fi
          echo "Toolchain versions match exactly: $TOOLCHAIN_FILE"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --locked

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Build documentation
        run: cargo doc --workspace --no-deps --locked

      - name: Compile fuzz targets
        run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked

  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Check workspace at MSRV
        run: |
          rustc --version
          cargo check --workspace --all-targets --locked
          cargo check --manifest-path fuzz/Cargo.toml --bins --locked

  supply-chain:
    name: Supply-chain policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Check RustSec advisories
        run: |
          cargo audit --deny warnings
          cargo audit --file fuzz/Cargo.lock --no-fetch --deny warnings

      - name: Check licenses, bans, and sources
        run: |
          cargo deny check licenses bans sources
          cargo deny --manifest-path fuzz/Cargo.toml --config fuzz/deny.toml check licenses bans sources

  conformance:
    name: Package conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the release binary
        run: cargo build --release --locked --bin rust-panosmcp

      - name: Stage the package
        run: |
          set -euo pipefail
          mkdir -p staging/bin
          cp target/release/rust-panosmcp staging/bin/
          cp -r packaging staging/packaging
          cp packaging/conformance.toml staging/

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: rust-panosmcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Conformance
        uses: mechubsec/mecmcp/packaging/conformance@373dc51cac90b97e728e20363b4b05d7b2c179a5
        with:
          staging: staging
          manifest: staging/conformance.toml
          image: rust-panosmcp:ci

  release-candidate:
    name: Release candidate packaging
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.89.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.89
        uses: dtolnay/rust-toolchain@1.89.0

      - name: Verify packaging policy
        run: |
          rustc --version
          scripts/verify-packaging.sh

      - name: Verify and build reproducible archive
        env:
          PANOSMCP_OUTPUT_DIR: ${{ github.workspace }}/dist
        run: scripts/verify-reproducible-build.sh

      - name: Smoke release binary
        run: |
          mkdir -p "$RUNNER_TEMP/rust-panosmcp-rc"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/rust-panosmcp-rc"
          "$RUNNER_TEMP"/rust-panosmcp-rc/*/bin/rust-panosmcp --version

      - name: Build hardened container
        run: |
          docker build \
            --build-arg VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)" \
            --build-arg VCS_REF="$GITHUB_SHA" \
            --tag rust-panosmcp:ci .
          test "$(docker image inspect --format '{{.Config.User}}' rust-panosmcp:ci)" = "65532:65532"
          docker run --rm --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges rust-panosmcp:ci --version

          # Regression test for mecmcp#357: config paths must survive operator overrides.
          # Docker replaces CMD entirely when the caller supplies args, but ENTRYPOINT
          # is appended to. Security-relevant flags (device-mapping, tokens-file,
          # state-file, audit-hmac-key-file) must live in ENTRYPOINT so they cannot be lost.
          container_id=$(docker create rust-panosmcp:ci --host 0.0.0.0)
          argv=$(docker inspect "$container_id" --format '{{join .Args "\n"}}')
          docker rm "$container_id" > /dev/null

          echo "$argv" | grep -q -- '--tokens-file' || { echo "FAIL: --tokens-file missing from argv with --host override"; exit 1; }
          echo "$argv" | grep -q -- '--state-file' || { echo "FAIL: --state-file missing from argv with --host override"; exit 1; }
          echo "$argv" | grep -q -- '--device-mapping' || { echo "FAIL: --device-mapping missing from argv with --host override"; exit 1; }
          # mecmcp#376 / MEC-978: packaging/conformance.toml's must_survive_override
          # already lists --audit-hmac-key-file, and conformance R6 enforces it via
          # verify-image.sh. Duplicate that check here so the docker-build job fails
          # fast too, without waiting on the separate conformance job.
          echo "$argv" | grep -q -- '--audit-hmac-key-file' || { echo "FAIL: --audit-hmac-key-file missing from argv with --host override"; exit 1; }
          echo "PASS: config paths survive --host override"

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: rust-panosmcp-release-candidate
          path: dist/*
          if-no-files-found: error
