name: Release image

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver image version, for example 0.2.0'
        required: true

jobs:
  release:
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing exchanges this job's OIDC token for a
      # short-lived Fulcio certificate; no key material is stored anywhere.
      # A reusable workflow's permissions can only be narrowed by the
      # caller, never widened, so this job must grant them itself -- see
      # mecmcp's docs/RELEASE-WORKFLOWS.md.
      id-token: write
    uses: mechubsec/mecmcp/.github/workflows/reusable-release-image.yml@78f0b978cf67ca10547cce4c15111eb7a872d886 # v0.33.2
    with:
      # GHCR requires a lowercase image path; github.repository is already lowercase.
      image: ghcr.io/${{ github.repository }}
      # Dual-push (mecmcp MEC-2110). Docker Hub org is `mechub`.
      dockerhub-image: docker.io/mechub/rustpanosmcp
      description: 'PAN-OS MCP server'
      version: ${{ github.event.inputs.version }}
    secrets:
      dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

  tag-version:
    name: Resolve tag version
    # reusable-registry-publish.yml re-verifies the pushed tag's signature
    # itself and has no workflow_dispatch story, so this job (and the
    # registry-publish job below) only runs for the tag-push trigger.
    if: github.event_name == 'push'
    permissions: {}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Strip leading v from the pushed tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  registry-publish:
    name: Publish to MCP Registry
    if: github.event_name == 'push'
    needs: [release, tag-version]
    permissions:
      contents: read
      id-token: write
    uses: mechubsec/mecmcp/.github/workflows/reusable-registry-publish.yml@39e7308cda922dadad18a0b0a5775ec1ab4a0bca # v0.32.0
    with:
      version: ${{ needs.tag-version.outputs.version }}
      oci-image: ghcr.io/${{ github.repository }}:${{ needs.tag-version.outputs.version }}
