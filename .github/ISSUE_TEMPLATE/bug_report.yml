name: Bug report
description: Report something that isn't working as expected
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. If this is a security vulnerability, please use "Report a vulnerability" below instead — do not file it here.
  - type: input
    id: version
    attributes:
      label: Version
      description: rust-panosmcp version (or commit SHA) you're using
      placeholder: "0.16.0"
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      description: Which transport were you using when this happened?
      options:
        - stdio
        - streamable-http
        - Not sure / not applicable
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal CLI invocation or MCP tool call that reproduces the issue. Please sanitize any device output — no real hostnames, credentials, serials, or API keys.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Rust version (`rustc --version`), OS, deployment mode (binary/LXC/Docker), and PAN-OS version if relevant
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Sanitized audit/tracing output or error text, if any. Debug/trace logs can contain bearer tokens or PAN-OS API keys — redact before pasting.
      render: shell
    validations:
      required: false
