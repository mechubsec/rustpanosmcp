services:
  rust-panosmcp:
    image: ghcr.io/mechubsec/rustpanosmcp:0.16.0
    user: "65532:65532"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700
    volumes:
      - ./runtime:/etc/rust-panosmcp:ro
      - ./state:/var/lib/rust-panosmcp:rw
    ports:
      - "30031:30031"
    # --device-mapping, --tokens-file, --state-file, --audit-hmac-key-file, and
    # --audit-redact are all baked into the image's ENTRYPOINT — do not repeat
    # any of them here. `command:` is appended to ENTRYPOINT (not merged with
    # CMD), so passing one again duplicates the flag and rust-panosmcp refuses
    # to start with a clap "cannot be used multiple times" error. tokens.json
    # lives in ./state, alongside mutation-state.json and audit-hmac.key,
    # since ENTRYPOINT points --tokens-file and --audit-hmac-key-file at
    # /var/lib/rust-panosmcp/tokens.json and /var/lib/rust-panosmcp/audit-hmac.key.
    # The key is generated on first run if absent (mecmcp#376 / MEC-978) — keep
    # ./state persisted across restarts, or every prior audit record's HMAC
    # becomes unverifiable against the new key.
    command:
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "30031"
      - --tls-cert
      - /etc/rust-panosmcp/server.crt
      - --tls-key
      - /etc/rust-panosmcp/server.key
      - --allowed-host
      - mcp.example.test:30031
      - --allowed-origin
      - https://client.example.test
