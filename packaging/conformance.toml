binary     = "bin/rust-panosmcp"
installer  = "packaging/lxc/install.sh"
service    = "rust-panosmcp"
config_dir = "/etc/rust-panosmcp"
tokens     = "/var/lib/rust-panosmcp/tokens.json"

# rust-panosmcp has a supported skip-build path (PANOSMCP_PACKAGE_SKIP_BUILD)
# and scripts/build-release.sh emits an honest BUILD-INFO either way -- a real
# rustc -vV when it compiled the binary, "unknown (...)" when it did not. R3 is
# therefore fatal rather than a warning. See mecmcp#355.
build_info     = true
skip_build_env = "PANOSMCP_PACKAGE_SKIP_BUILD"

units = ["packaging/systemd/rust-panosmcp.service"]

# The inventory path must survive an operator override. It currently lives in
# CMD, which Docker replaces wholesale -- mecmcp#357. Fixed in that PR.
#
# --audit-hmac-key-file closes the "5 of 6 server images run unkeyed audit"
# gap (mecmcp#376 / MEC-978): it lives in ENTRYPOINT (#220) but was never
# added here, so R6 never verified it survives an operator override the way
# it already does for rustsdcmcp#204 and rustproxmoxmcp#153.
must_survive_override = ["--device-mapping", "--audit-hmac-key-file"]

# The binary generates its own key when the file is absent and the image has
# no shell to run a key-generating entrypoint script, so this declares the
# audit_hmac_flag pattern instead of audit_entrypoint. Promotes conformance
# R7 from warn to fatal: the flag above is already in must_survive_override,
# so R6 proves it reaches the running container's argv.
audit_hmac_flag = "--audit-hmac-key-file"
